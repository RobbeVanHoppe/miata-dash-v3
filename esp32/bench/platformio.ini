; Bench tests on a bare ESP32 (nothing wired to its pins):
;   pio test -e bench          node_logic / knob_logic unit tests on the chip
;   pio run -e bench -t upload  CAN self-test (TWAI, no transceiver needed), output on serial
[env:bench]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200  ; CH340 adapters are unreliable faster
lib_extra_dirs = ../lib
test_framework = unity
