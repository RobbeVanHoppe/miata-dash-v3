; Knob node: ESP32 + SimpleFOC haptic BLDC knob, CAN to the Pi, PI_ON_REQ to the power board.
[env:knob-node]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200  ; CH340 adapters are unreliable faster
lib_extra_dirs = ../lib
lib_deps = askuric/Simple FOC@2.3.3  ; 2.3.4+ needs Arduino-ESP32 3.x (ESP-IDF 5); this platform has 2.0.17
build_flags = -Wall
