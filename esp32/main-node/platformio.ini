; Main node: ESP32 car-state master (relays, inputs, auto lights-off).
[env:main-node]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200  ; CH340 adapters are unreliable faster
lib_extra_dirs = ../lib
build_flags = -Wall -Wextra

; Same firmware, car replaced by a serial console (see src/bench_io.h, tools/bench_main_node.py).
[env:main-node-bench]
extends = env:main-node
build_flags = ${env:main-node.build_flags} -DMAIN_BENCH
