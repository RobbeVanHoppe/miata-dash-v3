[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "miata-dash"
version = "0.1.0"
description = "Dashboard head unit for a 1989 Mazda MX-5 NA (Raspberry Pi 3B, ME221 over CAN, GPS speed)"
requires-python = ">=3.11"
dependencies = [
    "flask>=2.2",
    "python-can>=4.2",
    "cantools>=39.0",
    "pyserial>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
miata-dash = "miata_dash.__main__:main"

[tool.setuptools.packages.find]
where = ["pi"]

[tool.setuptools.package-data]
miata_dash = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["pi/tests"]
