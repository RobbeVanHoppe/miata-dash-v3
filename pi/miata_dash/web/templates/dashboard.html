{% extends "base.html" %}
{% block content %}
<div class="grid">
  {% for g in gauges %}
  <section class="gauge stale" id="g-{{ g.id }}">
    <div class="label">{{ g.label }}</div>
    <div class="value"><span class="num">--</span> <span class="unit">{{ g.unit }}</span></div>
    <div class="bar"><div class="fill"></div></div>
  </section>
  {% endfor %}
</div>
{% endblock %}
{% block scripts %}
<script>
  window.GAUGES = {{ gauges | tojson }};
  window.STALE_AFTER = {{ stale_after | tojson }};
</script>
<script src="{{ url_for('static', filename='dashboard.js') }}"></script>
{% endblock %}
