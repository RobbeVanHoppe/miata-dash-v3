; Power supervisor on the PSB: ATtiny84A-PU, 1 MHz internal RC, plain avr-libc.
; Fuses per miata-hw design-power.md sec. 6.1: 8 MHz RC with CKDIV8 (1 MHz), BOD 2.7 V,
; EESAVE. Program with a 3.3 V ISP (unplug the Pi and the knob: MOSI/MISO drive their lines).
[env:attiny84a]
platform = atmelavr@5.1.0
board = attiny84
board_build.f_cpu = 1000000L
build_flags = -Wall -Os
upload_protocol = usbasp
board_fuses.lfuse = 0x52  ; CKDIV8, 8 MHz RC, SUT 14 CK + 4 ms
board_fuses.hfuse = 0xD5  ; SPIEN, EESAVE, BODLEVEL 2.7 V
board_fuses.efuse = 0xFF
